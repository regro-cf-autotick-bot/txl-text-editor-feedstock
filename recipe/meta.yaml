{% set python_min = "3.10" %}
{% set name = "txl-text-editor" %}
{% set version = "0.3.8" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/txl_text_editor-{{ version }}.tar.gz
  sha256: 0515828f834832145fd63d833c4e5524fbdb61add2b3403191f2409f94e70fea

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}
    - txl =0.3.2

test:
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check
  imports:
    - txl_text_editor

about:
  home: https://github.com/davidbrochart/jpterm/blob/main/plugins/text_editor
  summary: TXL plugin for a text editor
  dev_url: https://github.com/davidbrochart/jpterm/blob/main/plugins/text_editor
  license_file: LICENSE.txt
  license: MIT
  license_family: MIT

extra:
  recipe-maintainers:
    - davidbrochart
